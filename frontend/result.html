<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hasil Ringkasan — Skription AI</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />

  <style>
    .top-controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
      margin-bottom: 20px;
      z-index: 10;
      position: relative;
    }
    .btn-small {
      background: white;
      border: 1px solid rgba(0, 0, 0, 0.15);
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      transition: 0.2s;
    }
    .btn-small:hover {
      background: #f1f1f1;
    }
    .big-frame {
      background: white;
      border-radius: 12px;
      padding: 25px;
      border: 1px solid rgba(0, 0, 0, 0.12);
      margin-top: 10px;
      line-height: 1.65;
    }
    .section {
      border-top: 1px dashed rgba(0, 0, 0, 0.1);
      padding: 15px 0;
    }
    .section:first-child {
      border-top: none;
    }
    .sec-head {
      display: flex;
      justify-content: space-between;
      cursor: pointer;
      gap: 16px;
      align-items: center;
    }
    .chev {
      display: inline-block;
      transition: transform 0.25s;
    }
    .chev.open {
      transform: rotate(90deg);
    }
    .tldr {
      font-size: 14px;
      color: var(--primary);
      font-weight: 600;
      margin-bottom: 10px;
    }
    .bullet-text ul {
      margin-left: 22px;
      margin-top: 10px;
      margin-bottom: 15px;
      padding-left: 5px;
    }
    .bullet-text li {
      margin-bottom: 8px;
    }
    .highlight {
      background: #fff3cd;
      padding: 4px 6px;
      border-radius: 6px;
    }
    .warning-box{
      background:#fff3cd;
      color:#ffd600;
      padding:15px;
      border-radius:8px;
      border:1px solid #e6c86e;
      margin-bottom:20px;
      font-size:15px;
      font-weight:600;
    }
    
  </style>
</head>

<body>

  <div class="wavy-bg">
    <div class="wave wave-1"></div>
    <div class="wave wave-2"></div>
    <div class="wave wave-3"></div>
  </div>

  <div class="container">
    <header class="header">
      <h1>📄 Hasil Ringkasan</h1>
      <p class="muted">Hasil ringkasan dokumen Anda:</p>
    </header>

    <div style="display:flex;justify-content:flex-end;margin-bottom:15px;">
      <a href="index.html" class="btn-secondary">⬅️ Kembali ke Upload</a>
    </div>

    <div class="top-controls">
      <button id="expandAll" class="btn-small">Expand All</button>
      <button id="collapseAll" class="btn-small">Collapse All</button>
      <button id="toggleHighlight" class="btn-small">Highlight</button>
      <button id="toggleTLDR" class="btn-small">TL;DR</button>
      <button id="copyAll" class="btn-small">Copy All</button>
    </div>
    
    <main id="resultsContainer"></main>

        <!-- =======================  QnA BOX  ======================= -->
  <div class="big-frame" style="margin-bottom:20px;">
  <h2>❓ Tanya Dokumen</h2>
  <p class="muted">Ajukan pertanyaan mengenai isi PDF yang telah diproses.</p>

  <textarea id="askInput" 
    placeholder="Contoh: Apa tujuan penelitian pada skripsi ini?" 
    style="width:100%;height:70px;margin-top:8px;padding:10px;border-radius:8px;border:1px solid #ccc;font-size:14px;"></textarea>

  <button id="askBtn" class="btn-primary" style="margin-top:10px;">🔍 Tanyakan ke AI</button>

  <div id="askResult" 
    style="margin-top:15px;white-space:pre-line;background:#fff;border-radius:10px;padding:15px;display:none;border:1px solid #e6e6e6;"></div>
</div>

</div>

<script>
const isLocal = location.hostname === "localhost" || location.hostname === "127.0.0.1" || location.protocol === "file:";
const BASE_API = isLocal ? "http://localhost:8000" : "https://docusum.onrender.com";

const container = document.getElementById("resultsContainer");

function escapeHTML(t = "") {
  return t.replace(/[&<>"']/g, m =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m])
  );
}

function splitSentences(t) {
  return t.split(/(?<=[.!?])\s+/).map(x => x.trim()).filter(Boolean);
}

function makeTLDR(t) {
  const s = splitSentences(t);
  return s.slice(0, 2).join(" ");
}
  
function makeBulletDOM(t) {
  const ul = document.createElement("ul");
  t.split(/\n+/).forEach(p => {     // Split berdasarkan paragraf, bukan titik
    if(p.trim().length > 0){
      const li = document.createElement("li");
      li.textContent = p.trim();
      ul.appendChild(li);
    }
  });
  return ul;
}

let SHOW_TLDR = true;
let HIGHLIGHT = false;

function downloadFile(url) {
  if (!url.startsWith("http")) url = BASE_API + url;
  const a = document.createElement("a");
  a.href = url;
  a.setAttribute("download", "");
  document.body.appendChild(a);
  a.click();
  a.remove();
}

function render() {
  const results = JSON.parse(sessionStorage.getItem("docuSumResults") || "[]");
  if (!results.length) {
    container.innerHTML = `<p style="text-align:center;color:#777;">Belum ada hasil.</p>`;
    return;
  }

  container.innerHTML = "";

  results.forEach(doc => {
    const card = document.createElement("div");
    card.className = "result-card";

    card.innerHTML = `
      <div class="file-item">
        <div class="file-info">
          <div class="file-icon">📄</div>
          <div class="file-details"><h4>${escapeHTML(doc.file)}</h4></div>
        </div>
        <div class="file-status">
          <span class="status-completed">✅ Selesai diproses</span>
        </div>
      </div>
    `;

    const dl = document.createElement("div");
    dl.className = "download-bar";

    if (doc.download_pdf) {
      let b = document.createElement("button");
      b.className = "btn-primary";
      b.textContent = "📥 Download PDF";
      b.onclick = () => downloadFile(doc.download_pdf);
      dl.appendChild(b);
    }
    if (doc.download_docx) {
      let b2 = document.createElement("button");
      b2.className = "btn-primary";
      b2.textContent = "📥 Download DOCX";
      b2.onclick = () => downloadFile(doc.download_docx);
      dl.appendChild(b2);
    }
    card.appendChild(dl);

    const big = document.createElement("div");
  big.className = "big-frame";

  // jika tidak deteksi bab
  if (!doc.sections || doc.sections.length === 0) {
      big.innerHTML = `
        <div class="warning-box">
            ⚠ <b>Dokumen ini berhasil diproses, tetapi *tidak ditemukan struktur BAB seperti skripsi*.</b><br>
            Anda masih dapat menggunakan fitur <b>Tanya Dokumen</b> di bawah untuk menanyakan isi dokumen.
        </div>
      `;
    }
    
    (doc.sections || []).forEach(s => {
      if (!s.ringkasan_bab?.trim()) return;

      const section = document.createElement("div");
      section.className = "section";

      const secHead = document.createElement("div");
      secHead.className = "sec-head";

      const chev = document.createElement("span");
      chev.className = "chev open";
      chev.textContent = "▶";

      const title = document.createElement("h3");
      title.textContent = s.judul;

      secHead.appendChild(title);
      secHead.appendChild(chev);

      const content = document.createElement("div");
      content.className = "sec-content";

      const tldr = document.createElement("div");
      tldr.className = "tldr";
      tldr.style.display = SHOW_TLDR ? "block" : "none";
      tldr.textContent = makeTLDR(s.ringkasan_bab);

      const bullets = document.createElement("div");
      bullets.className = "bullet-text";
      bullets.appendChild(makeBulletDOM(s.ringkasan_bab));

      content.appendChild(tldr);
      content.appendChild(bullets);

      secHead.onclick = () => {
        const open = content.style.display !== "none";
        content.style.display = open ? "none" : "block";
        chev.classList.toggle("open", !open);
      };

      section._content = content;
      section.appendChild(secHead);
      section.appendChild(content);
      big.appendChild(section);
    });

    card.appendChild(big);
    container.appendChild(card);
  });
}

document.getElementById("expandAll").onclick = () => {
  document.querySelectorAll(".section").forEach(s => {
    s._content.style.display = "block";
    s.querySelector(".chev").classList.add("open");
  });
};

document.getElementById("collapseAll").onclick = () => {
  document.querySelectorAll(".section").forEach(s => {
    s._content.style.display = "none";
    s.querySelector(".chev").classList.remove("open");
  });
};

document.getElementById("toggleHighlight").onclick = () => {
  HIGHLIGHT = !HIGHLIGHT;
  document.querySelectorAll("li").forEach(li => 
    li.classList.toggle("highlight", HIGHLIGHT)
  );
};

document.getElementById("toggleTLDR").onclick = () => {
  SHOW_TLDR = !SHOW_TLDR;
  document.querySelectorAll(".tldr").forEach(t =>
    t.style.display = SHOW_TLDR ? "block" : "none"
  );
};

document.getElementById("copyAll").onclick = async () => {
  const el = document.getElementById("resultsContainer");
  const txt = el.innerText?.trim();
  if (!txt) return alert("Tidak ada yang bisa disalin.");
  try { await navigator.clipboard.writeText(txt); alert("📋 Disalin!"); }
  catch { alert("Clipboard gagal."); }
};

/* ============================  QnA ASK SYSTEM  ============================ */

document.getElementById("askBtn").onclick = async () => {
  const q = document.getElementById("askInput").value.trim();
  if (!q) return alert("❗ Pertanyaan tidak boleh kosong.");

  const results = JSON.parse(sessionStorage.getItem("docuSumResults") || "[]");
  if (!results.length) return alert("❗ Tidak ada dokumen yang diproses.");

  const fileName = results[0]?.file;

  const box = document.getElementById("askResult");
  box.style.display = "block";
  box.textContent = "⏳ Sedang memproses pertanyaan...";

  try {
    const res = await fetch(`${BASE_API}/api/ask`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: q, file: fileName })
    });

    const data = await res.json();
    box.textContent = data.answer || "⚠ Tidak ditemukan jawaban pada dokumen.";
  } 
  catch(e){
    box.textContent = "❌ Terjadi kesalahan saat memproses pertanyaan.";
  }
};
  
const warn = sessionStorage.getItem("docuSumWarning");
if (warn) {
  const warnBox = document.createElement("div");
  warnBox.className = "warning-box";
  warnBox.textContent = `⚠ ${warn}`;

  document.querySelector(".header").after(warnBox);

  sessionStorage.removeItem("docuSumWarning");
}

render();
</script>

</body>
</html>
